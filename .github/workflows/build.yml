name: Create a build

on: workflow_dispatch

permissions:
  contents: write   # needed to create a tag and a release

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: 9
    - name: Publish package
      run: dotnet publish src/GamesLauncher -c Release -r win-x64 --no-self-contained -o publish/
    - uses: actions/upload-artifact@v4
      with:
        name: GamesLauncher
        path: publish/
        if-no-files-found: error
    - name: Zip
      shell: pwsh
      run: Compress-Archive -Path publish/* -DestinationPath GamesLauncher.zip
    - name: Create draft release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = "v" + (Get-Content src/GamesLauncher/plugin.json | ConvertFrom-Json).Version
        gh release create $version GamesLauncher.zip --draft --generate-notes --target $env:GITHUB_SHA --title $version
